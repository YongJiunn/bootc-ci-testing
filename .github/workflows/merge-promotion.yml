name: bootc-merge-promotion

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write
  packages: write
  pull-requests: read
  id-token: write

jobs:

  # =============================================================================
  # JOB: setup-matrix
  # Identifies which variants were affected by the merged PR.
  #
  # Same path-filter logic as pr-ci.yml. We only promote variants whose source
  # files were part of this PR — avoids re-promoting unrelated variants and
  # keeps the :latest tag stable for variants that didn't change.
  # =============================================================================
  setup-matrix:
    name: Identify Merged Variants
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pr-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Filter Paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            common:
              - 'Containerfile'
              - 'build_scripts/common/**'
            postgres:
              - 'build_scripts/postgres/**'
            haproxy:
              - 'build_scripts/haproxy/**'
            servicevm:
              - 'build_scripts/servicevm/**'
            bastion:
              - 'build_scripts/bastion/**'

      - name: Build PR Matrix
        id: pr-matrix
        uses: actions/github-script@v7
        with:
          script: |
            const all = ["postgres", "haproxy", "servicevm", "bastion"];
            const isPR = context.eventName === "pull_request";
            let matrix = [];

            if (isPR) {
              const changed = {
                common: "${{ steps.filter.outputs.common }}" === "true",
                postgres: "${{ steps.filter.outputs.postgres }}" === "true",
                haproxy: "${{ steps.filter.outputs.haproxy }}" === "true",
                servicevm: "${{ steps.filter.outputs.servicevm }}" === "true",
                bastion: "${{ steps.filter.outputs.bastion }}" === "true",
              };
              matrix = changed.common ? all : all.filter(v => changed[v]);
            } else {
              matrix = all;
            }

            if (matrix.length === 0) {
              core.info("No variants matched by path filter. Matrix will be empty.");
            }
            core.setOutput("matrix", JSON.stringify(matrix));

  # =============================================================================
  # JOB: promote-image
  # Promotes the tested PR snapshot to :latest. Runs once per variant in the matrix.
  #
  # We never rebuild on merge. Instead, we pull the exact OCI digest that was
  # built and tested during the PR, retag it as :latest, and push. This gives a
  # mathematical guarantee: the :latest image is byte-for-byte identical to what
  # passed all tests in the PR — no possibility of dependency drift between
  # test time and release time.
  #
  # After promotion the :pr-{N} tag is deleted to keep the registry clean.
  # A verification pull confirms the tag is truly gone before the job completes.
  # =============================================================================
  promote-image:
    name: Promote Artifact to Latest
    needs: [setup-matrix]
    if: needs.setup-matrix.outputs.matrix != '[]' && needs.setup-matrix.outputs.matrix != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
    steps:
      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Pull the PR snapshot by its immutable :pr-{N} tag, retag as :latest, push.
      # No podman build here — same layers, same digest, just a new tag reference.
      - name: Promote Tag
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/bootc-${{ matrix.variant }}"

          echo "Pulling successful PR artifact to promote it..."
          podman pull "${IMAGE}:pr-${{ github.event.pull_request.number }}"

          echo "Promoting image to latest tag on main stream..."
          podman tag "${IMAGE}:pr-${{ github.event.pull_request.number }}" "${IMAGE}:latest"
          podman push "${IMAGE}:latest"

      # Remove the :pr-{N} tag now that :latest points to the same digest.
      # Uses the GitHub Packages API directly: list versions, filter by tag name
      # to get the version ID, then delete by ID.
      - name: Delete PR Artifact Tag
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          PR_TAG="pr-${{ github.event.pull_request.number }}"
          PACKAGE="bootc-${{ matrix.variant }}"

          VERSION_ID=$(gh api "/users/${OWNER}/packages/container/${PACKAGE}/versions" \
            --jq ".[] | select(.metadata.container.tags[] == \"${PR_TAG}\") | .id")

          if [ -n "$VERSION_ID" ]; then
            gh api --method DELETE "/user/packages/container/${PACKAGE}/versions/${VERSION_ID}"
            echo "Deleted tag ${PR_TAG} (version id: ${VERSION_ID})"
          else
            echo "Tag ${PR_TAG} not found, skipping"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Confirm deletion by attempting to pull the tag.
      # A successful pull means the tag still exists and deletion failed → step fails.
      # A failed pull (manifest not found) is the expected passing outcome.
      - name: Verify PR Tag Deleted
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/bootc-${{ matrix.variant }}:pr-${{ github.event.pull_request.number }}"
          if podman pull "${IMAGE}" 2>/dev/null; then
            echo "ERROR: PR tag still exists after deletion!"
            exit 1
          else
            echo "PR tag confirmed deleted"
          fi
