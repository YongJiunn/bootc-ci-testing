name: bootc-build-postgres

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main, dev ]
    tags:
      - '*-v*'
      - 'v*'

# Required for:
# - GHCR push: packages:write
# - Keyless Cosign: id-token:write (OIDC)
# - Checkout: contents:read
permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  lint:
    name: Lint Scripts & Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tooling (shellcheck)
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: ShellCheck all shell scripts
        run: |
          shellcheck $(find . -type f -name "*.sh")

      - name: CRLF check
        run: |
          if grep -R $'\r' build_scripts Containerfile; then
            echo "CRLF line endings detected. Use LF only."
            exit 1
          fi

  setup-matrix:
    name: Determine Variants to Build
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    env:
      PR_BODY: ${{ github.event.pull_request.body }}
      TAG_NAME: ${{ github.ref_name }}
      EVENT: ${{ github.event_name }}
    steps:
      - name: Calculate Matrix
        id: set
        run: |
          # Supported default list if nothing is specified
          DEFAULT_MATRIX='["postgres", "mysql", "redis"]'
          SELECTED="[]"

          if [ "$EVENT" == "pull_request" ]; then
            echo "Event is Pull Request. Parsing PR body for checkboxes..."
            
            # Extracts words following "- [x] " in the PR body. 
            # Example: "- [x] postgres" -> "postgres"
            # We use '--' to tell grep that the pattern starting with '-' is not an options flag.
            VARIANTS=$(echo "$PR_BODY" | grep -ioE -- '-\s*\[x\]\s+[a-zA-Z0-9_-]+' | awk '{print $3}' || true)
            
            if [ -n "$VARIANTS" ]; then
              # Convert bash multiline string into a JSON array: ["postgres", "redis"]
              SELECTED=$(echo "$VARIANTS" | jq -R -s -c 'split("\n") | map(select(length > 0))')
              echo "Parsed variants from PR: $SELECTED"
            else
              echo "No checkboxes found. Defaulting to all."
              SELECTED="$DEFAULT_MATRIX"
            fi

          elif [[ "$TAG_NAME" == *-v* ]]; then
            echo "Event is Tag. Parsing tag name..."
            
            # Extract everything before '-v' (e.g., 'postgres' from 'postgres-v1.0.0')
            PREFIX=$(echo "$TAG_NAME" | sed -n 's/^\(.*\)-v[0-9].*/\1/p')
            
            if [ -n "$PREFIX" ]; then
              echo "Found explicit variant prefix: $PREFIX"
              SELECTED="[\"$PREFIX\"]"
            else
              echo "Tag does not specify a variant (e.g., 'v1.0.0'). Defaulting to all."
              SELECTED="$DEFAULT_MATRIX"
            fi

          else
            echo "Standard push or dispatch. Defaulting to all."
            SELECTED="$DEFAULT_MATRIX"
          fi

          echo "matrix=$SELECTED" >> $GITHUB_OUTPUT

  build-variants:
    name: Build & Scan Image
    needs: [lint, setup-matrix]
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:    
        # GitHub will dynamically spin up runners for ONLY the variants requested
        variant: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tooling (podman, prereqs)
        run: |
          sudo apt-get update
          sudo apt-get install -y podman wget gnupg lsb-release

      - name: Build ${{ matrix.variant }} bootc image
        env:
          BOOTLOADER_PASSWORD: ${{ secrets.BOOTLOADER_PASSWORD }}
          DEFAULT_PASSWORD: ${{ secrets.DB_DEFAULT_PASSWORD }}
          POSTGRES_EXPORTER_PASSWORD: ${{ secrets.DB_EXPORTER_PASSWORD }}
          POSTGRESQL_REPLICATION_PASSWORD: ${{ secrets.DB_REPLICATION_PASSWORD }}
        run: |
          podman build \
            -f Containerfile \
            -t bootc-${{ matrix.variant }}:latest \
            --build-arg VARIANT=${{ matrix.variant }} \
            --build-arg HARDENED=true \
            --secret id=bootloader_pwd,env=BOOTLOADER_PASSWORD \
            --secret id=default_pwd,env=DEFAULT_PASSWORD \
            --secret id=exporter_pwd,env=POSTGRES_EXPORTER_PASSWORD \
            --secret id=replication_pwd,env=POSTGRESQL_REPLICATION_PASSWORD \
            --no-cache \
            .

      - name: Save image as OCI archive
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          podman save \
            -o bootc-${{ matrix.variant }}.tar \
            bootc-${{ matrix.variant }}:latest

      - name: Install Trivy
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release

          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | \
            sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg

          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] \
            https://aquasecurity.github.io/trivy-repo/deb \
            $(lsb_release -sc) main" | \
            sudo tee /etc/apt/sources.list.d/trivy.list > /dev/null

          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Generate Trivy report
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --format table \
            --output trivy-report.txt \
            --input bootc-${{ matrix.variant }}.tar

      - name: Generate Blank SFR
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cat << 'EOF' > sfr-report.toml
          [report.details]
          name =
          type =
          date = 

          [report.software.image]
          image_source = 
          full_image_tag = 

          [report.software.general]
          language =  ""
          works_offline = ""
          add_scripting_capabilities = ""
          require_elevated_cluster_privileges = ""
          external_dependencies = ""
          support_prometheus_monitoring = ""
          configuration_mgmt_requirements = ""
          others = ""

          [report.software.opensource]      # if open-source
          reputation = ""
          source_code_url = ""
          updates = ""      # ignore if self-built
          community_support = ""
          cis-benchmark = ""      # NA | Applied | Applied with exceptions , pls submit supporting

          [report.software.closedsource]      # if closed-source
          reputation = ""
          updates = ""
          cis-benchmark = ""

          [report.software.va.urllib3]
          CVE-2025-XXXX = { expires_on = "", justification = "" }
          CVE-2025-XXXX = { expires_on = "", justification = "" }
          EOF

      - name: Upload Security Reports
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-${{ matrix.variant }}
          path: |
            trivy-report.txt
            sfr-report.toml

      # -------------------------
      # RELEASE-ONLY: Publish + Sign + ISO
      # -------------------------

      - name: Login to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Tag image for GHCR (semver + sha)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          SHA="${GITHUB_SHA::7}"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          podman tag bootc-${{ matrix.variant }}:latest "ghcr.io/${OWNER}/bootc-${{ matrix.variant }}:${VERSION}"
          podman tag bootc-${{ matrix.variant }}:latest "ghcr.io/${OWNER}/bootc-${{ matrix.variant }}:sha-${SHA}"

      - name: Push image to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        run: |  
          VERSION="${GITHUB_REF#refs/tags/}"
          SHA="${GITHUB_SHA::7}"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          podman push "ghcr.io/${OWNER}/bootc-${{ matrix.variant }}:${VERSION}"
          podman push "ghcr.io/${OWNER}/bootc-${{ matrix.variant }}:sha-${SHA}" 

      - name: Pull image for ISO (root namespace)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/bootc-${{ matrix.variant }}:${VERSION}"

          sudo podman pull "${IMAGE}"

      - name: Build ISO (bootc-image-builder)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/bootc-${{ matrix.variant }}:${VERSION}"

          WORKDIR=$(pwd)
          mkdir -p "$WORKDIR/output"

          sudo podman run --rm \
            --name ${{ matrix.variant }}-bootc-image-builder \
            --privileged \
            --security-opt label=type:unconfined_t \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v "$WORKDIR/output:/output" \
            -v "$WORKDIR/image.toml:/config.toml:ro" \
            --label bootc.image.builder=true \
            quay.io/centos-bootc/bootc-image-builder:latest \
            "${IMAGE}" \
            --output /output/bootloader.iso \
            --type anaconda-iso \
            --target-arch amd64 \
            --rootfs ext4

      - name: Debug ISO existence
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "Current directory:"
          pwd
          echo "Listing workspace:"
          ls -lah
          echo "Listing output directory:"
          ls -lah output || true
          echo "Searching entire workspace:"
          find . -name "*.iso" || true

      - name: Split ISO for GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "ISO is too large (GitHub limits to 2GB per file)."
          echo "Splitting the ISO into 1.9GB chunks..."
          split -b 1900M output/bootloader.iso/bootiso/install.iso output/bootc-${{ matrix.variant }}.iso.part-

      - name: Upload ISO to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: output/bootc-${{ matrix.variant }}.iso.part-*

# Once the release is created, the ISO can be downloaded from the release page.
# The user can then use the following command to merge the ISO parts:
# cat bootc-postgres.iso.part-* > bootc-postgres.iso