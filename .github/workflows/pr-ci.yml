name: bootc-pr-ci

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read
  packages: write
  id-token: write

jobs:

  # =============================================================================
  # JOB: setup-matrix
  # Decides which variant(s) to build for this PR.
  #
  # Not every PR needs to rebuild every variant. This job reads which files
  # changed and produces a JSON array of variant names. The build-variants job
  # below runs once per entry in that array (GitHub Actions matrix strategy).
  #
  # Variant selection logic:
  #   - Containerfile or build_scripts/common/** changed
  #       → ALL variants rebuild. These are shared foundations — a change here
  #         could break any variant, so all must be re-validated.
  #   - Only build_scripts/postgres/** changed
  #       → ONLY "postgres" rebuilds. No point retesting haproxy/servicevm/bastion.
  #   - No recognised paths changed
  #       → Empty matrix; build-variants is skipped entirely.
  # =============================================================================
  setup-matrix:
    name: Determine Variants to Build
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pr-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Filter Paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            common:
              - 'Containerfile'
              - 'build_scripts/common/**'
            postgres:
              - 'build_scripts/postgres/**'
            haproxy:
              - 'build_scripts/haproxy/**'
            servicevm:
              - 'build_scripts/servicevm/**'
            bastion:
              - 'build_scripts/bastion/**'

      - name: Build PR Matrix
        id: pr-matrix
        uses: actions/github-script@v7
        with:
          script: |
            const all = ["postgres", "haproxy", "servicevm", "bastion"];
            const isPR = context.eventName === "pull_request";
            let matrix = [];

            if (isPR) {
              const changed = {
                common: "${{ steps.filter.outputs.common }}" === "true",
                postgres: "${{ steps.filter.outputs.postgres }}" === "true",
                haproxy: "${{ steps.filter.outputs.haproxy }}" === "true",
                servicevm: "${{ steps.filter.outputs.servicevm }}" === "true",
                bastion: "${{ steps.filter.outputs.bastion }}" === "true",
              };
              matrix = changed.common ? all : all.filter(v => changed[v]);
            } else {
              // For push to dev branch, default to building all variants locally
              matrix = all;
            }

            if (matrix.length === 0) {
              core.info("No variants matched by path filter. Matrix will be empty.");
            }
            core.setOutput("matrix", JSON.stringify(matrix));

  # =============================================================================
  # JOB: build-variants
  # Builds, boot-tests, security-scans, and snapshots each affected variant.
  # Runs in parallel, once per variant produced by setup-matrix.
  #
  # Step order is deliberate:
  #   1. Build         — compile OCI image; secrets injected at build-time only
  #   2. Boot & canary — start image under systemd; confirm init chain is healthy
  #   3. Variant tests — run .github/variant-tests/<variant>/*.sh inside the
  #                      running container (place your variant tests there)
  #   4. Teardown      — remove the test container before scanning
  #   5. Trivy scan    — CVE scan on a confirmed-functional image; avoids
  #                      spending scan time on images that can't even boot
  #   6. Push snapshot — tag the verified image as :pr-{N} for promotion on merge
  # =============================================================================
  build-variants:
    name: Build & Test Component
    needs: [setup-matrix]
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && needs.setup-matrix.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # podman: container runtime used to build and boot the image
      # trivy:  CVE scanner; installed here so the scan step has no network dependency later
      - name: Install Tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y podman wget gnupg lsb-release trivy

      # Compile the OCI image from the Containerfile.
      # Secrets are passed as --secret (tmpfs-backed during build, never baked
      # into any image layer). The resulting image lives locally only at this point.
      - name: Build ${{ matrix.variant }} bootc image
        env:
          BOOTLOADER_PASSWORD: ${{ secrets.BOOTLOADER_PASSWORD }}
          DEFAULT_PASSWORD: ${{ secrets.DB_DEFAULT_PASSWORD }}
          POSTGRES_EXPORTER_PASSWORD: ${{ secrets.DB_EXPORTER_PASSWORD }}
          POSTGRESQL_REPLICATION_PASSWORD: ${{ secrets.DB_REPLICATION_PASSWORD }}
        run: |
          podman build \
            -f Containerfile \
            -t bootc-${{ matrix.variant }}:latest \
            --build-arg VARIANT=${{ matrix.variant }} \
            --build-arg HARDENED=true \
            --secret id=bootloader_pwd,env=BOOTLOADER_PASSWORD \
            --secret id=default_pwd,env=DEFAULT_PASSWORD \
            --secret id=exporter_pwd,env=POSTGRES_EXPORTER_PASSWORD \
            --secret id=replication_pwd,env=POSTGRESQL_REPLICATION_PASSWORD \
            --no-cache \
            .

      # Start the image as a container with systemd as PID 1 (--systemd=always).
      # This mirrors the service startup behaviour of a real OS boot, minus the
      # firmware/bootloader/kernel path (see README for what this does and does
      # not validate).
      #
      # Canary: node-exporter sits at the tail of the systemd dependency chain.
      # If it is active, the entire unit graph executed successfully — init
      # scripts ran, services started, no silent crashes in the chain.
      - name: Test Systemd OS Boot
        run: |
          echo "Booting the immutable container with systemd..."
          podman run -d --systemd=always --name test-boot bootc-${{ matrix.variant }}:latest

          echo "Sleeping for 5s to allow kernel/init to boot..."
          sleep 5

          podman exec test-boot systemctl is-system-running --wait || true

          echo "--- Testing Generic OS Health (Canary Test) ---"
          if podman exec test-boot systemctl is-active node-exporter; then
              echo "✅ Canary is alive! Init chain perfectly executed."
          else
              echo "ERROR: The canary (node_exporter) failed to start!"
              exit 1
          fi

      # Variant-specific functional tests run inside the already-booted container.
      # To add tests for a variant, place shell scripts under:
      #   .github/variant-tests/<variant-name>/
      # Every *.sh file in that directory is copied into the container and
      # executed in alphabetical order. A non-zero exit from any script fails
      # the pipeline immediately.
      - name: Inject Variant-Specific Tests
        run: |
          TEST_DIR=".github/variant-tests/${{ matrix.variant }}"
          if [ -d "$TEST_DIR" ]; then
              echo "Found custom tests for ${{ matrix.variant }}! Injecting..."
              podman exec test-boot mkdir -p /tmp/tests
              podman cp $TEST_DIR/. test-boot:/tmp/tests/
              # Automatically execute all bash scripts inside the variant folder natively in the OS
              podman exec test-boot bash -c "chmod +x /tmp/tests/*.sh && for script in /tmp/tests/*.sh; do bash \$script || exit 1; done"
              echo "All variant custom scripts verified and successfully exited purely!"
          else
              echo "No custom tests defined for ${{ matrix.variant }}, skipping..."
          fi

      # Remove the test container before scanning. Runs even if earlier steps
      # failed so runner resources are always cleaned up.
      - name: Teardown Sandbox
        if: always()
        run: podman rm -f -v test-boot

      # Save to tarball so Trivy scans the local image without needing registry access.
      # Trivy runs here — after boot validation — so we only spend scan time on an
      # image that has already been confirmed functional. A broken image that can't
      # boot is caught earlier and never reaches this step.
      - name: Save image to tarball
        run: podman save -o bootc-${{ matrix.variant }}.tar bootc-${{ matrix.variant }}:latest

      - name: Generate Trivy report
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --format table \
            --output trivy-report-${{ matrix.variant }}.txt \
            --input bootc-${{ matrix.variant }}.tar

      - name: Upload Trivy report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report-${{ matrix.variant }}
          path: trivy-report-${{ matrix.variant }}.txt

      - name: Login to GHCR
        if: github.event_name == 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Snapshot the verified image to GHCR tagged as :pr-{N}.
      # On merge, the promotion workflow pulls this exact digest and retags it
      # as :latest — no rebuild. This guarantees the released image is byte-for-byte
      # identical to what was built and tested here.
      - name: Push PR Artifact Snapshot
        if: github.event_name == 'pull_request'
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/bootc-${{ matrix.variant }}"

          podman tag bootc-${{ matrix.variant }}:latest "${IMAGE}:pr-${{ github.event.pull_request.number }}"
          podman push "${IMAGE}:pr-${{ github.event.pull_request.number }}"
